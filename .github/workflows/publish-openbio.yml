name: publish-openbio
run-name: "${{ format('publish oh-my-openbio {0}', inputs.version) }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact oh-my-openbio version to publish (for example, 4.18.2-beta.1)"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag to assign (for example, beta or latest)"
        required: true
        default: beta
        type: string
      bootstrap:
        description: "Use NPM_TOKEN only to bootstrap the first beta publication"
        required: true
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Build vendored lsp-tools-mcp package
        run: npm ci && npm run build
        working-directory: packages/lsp-tools-mcp

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build vendored lsp-daemon package
        run: npm ci && npm run build
        working-directory: packages/lsp-daemon

      - name: Run OpenBio wrapper regression tests
        run: bun test bin/platform.test.ts script/publish-openbio-workflow.test.ts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Build vendored lsp-tools-mcp package
        run: npm ci && npm run build
        working-directory: packages/lsp-tools-mcp

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: bun run typecheck

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [test, typecheck]
    if: >-
      github.repository == 'GilbertHan1011/oh-my-openbio' &&
      needs.test.result == 'success' &&
      needs.typecheck.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.18.0

      - name: Check that the requested package version is unpublished
        env:
          VERSION: ${{ inputs.version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/oh-my-openbio/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "::error::oh-my-openbio@${VERSION} already exists on npm. Choose a new version."
            exit 1
          fi

      - name: Validate bootstrap publication request
        if: inputs.bootstrap == true
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DIST_TAG" != "beta" ] || [[ "$VERSION" != *-beta.* ]]; then
            echo "::error::Bootstrap publishing is limited to beta prereleases."
            exit 1
          fi

          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is required only for the first oh-my-openbio publication."
            exit 1
          fi

          PACKAGE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/oh-my-openbio")
          if [ "$PACKAGE_STATUS" != "404" ]; then
            echo "::error::Bootstrap publishing is only allowed before oh-my-openbio exists on npm (HTTP ${PACKAGE_STATUS})."
            exit 1
          fi

      - name: Verify npm trusted publisher
        if: inputs.bootstrap != true
        env:
          PACKAGE: oh-my-openbio
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: publish-openbio.yml
        run: |
          OIDC_TOKEN=$(curl -sH "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | jq -r '.value // empty')

          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::Failed to acquire a GitHub OIDC token."
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PACKAGE}" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}')

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::npm trusted publishing is not configured for ${PACKAGE} (HTTP ${STATUS})."
            echo "::error::Configure GitHub Actions trusted publishing for ${PACKAGE}: repository ${REPOSITORY}, workflow ${WORKFLOW_FILE}."
            exit 1
          fi

      - name: Build vendored lsp-tools-mcp package
        run: npm ci && npm run build
        working-directory: packages/lsp-tools-mcp

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build vendored lsp-daemon package
        run: npm ci && npm run build
        working-directory: packages/lsp-daemon

      - name: Stamp and build the oh-my-openbio wrapper
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg version "$VERSION" '
            .name = "oh-my-openbio"
            | .version = $version
            | .repository = { type: "git", url: "git+https://github.com/GilbertHan1011/oh-my-openbio.git" }
            | .bugs = { url: "https://github.com/GilbertHan1011/oh-my-openbio/issues" }
            | .homepage = "https://github.com/GilbertHan1011/oh-my-openbio#readme"
          ' package.json > tmp.json
          mv tmp.json package.json
          bun run build:codex-install && bun run build:lsp-tools-mcp && bun run build:lsp-daemon && bun run build
          node script/verify-npm-payload.mjs

      - name: Bootstrap publish oh-my-openbio
        if: inputs.bootstrap == true
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --ignore-scripts --access public --provenance --tag "$DIST_TAG" --loglevel verbose

      - name: Publish oh-my-openbio through trusted publishing
        if: inputs.bootstrap != true
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --ignore-scripts --access public --provenance --tag "$DIST_TAG" --loglevel verbose

      - name: Verify published oh-my-openbio version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PUBLISHED=$(npm view "oh-my-openbio@${VERSION}" version)
          if [ "$PUBLISHED" != "$VERSION" ]; then
            echo "::error::Expected oh-my-openbio@${VERSION}, received ${PUBLISHED}."
            exit 1
          fi
